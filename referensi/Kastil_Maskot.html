<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kastil Maskot</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ead9a8;--bg2:#cfb676;--ink:#2b1a0e;--body:#3b4048;--eye:#ffd76a;--red:#a4161a;--hat:#4b2a6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1d14;--bg2:#160e08;--ink:#e9d8a6;--body:#8a919c;--eye:#ffcf5a}}
:root[data-theme="dark"]{--bg:#2a1d14;--bg2:#160e08;--ink:#e9d8a6;--body:#8a919c;--eye:#ffcf5a}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at center,var(--bg) 55%,var(--bg2) 100%);color:var(--ink);font-family:Cinzel,Georgia,"Times New Roman",serif;font-weight:800;overflow:hidden;position:relative}
.wall{position:absolute;top:0;left:0;right:0;height:46px;background:var(--ink);
  -webkit-mask:linear-gradient(#000 0 0) bottom/100% 26px no-repeat,repeating-linear-gradient(90deg,#000 0 34px,transparent 34px 56px) top/100% 20px no-repeat;
  mask:linear-gradient(#000 0 0) bottom/100% 26px no-repeat,repeating-linear-gradient(90deg,#000 0 34px,transparent 34px 56px) top/100% 20px no-repeat}
h1{position:absolute;top:84px;width:100%;text-align:center;font-size:clamp(20px,4.6vw,42px);margin:0;letter-spacing:.04em}
p{position:absolute;top:calc(84px + clamp(26px,6vw,56px));width:100%;text-align:center;margin:0;font-weight:600;font-size:clamp(13px,2.4vw,18px);opacity:.8}
.castle{position:fixed;z-index:48;left:6px;bottom:14px;width:150px;pointer-events:none;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.25))}
.castle svg{display:block;width:100%;height:auto}
.flag{transform-box:fill-box;transform-origin:0 50%;animation:fw 1s ease-in-out infinite alternate}
@keyframes fw{from{transform:skewY(-8deg) scaleX(1)}to{transform:skewY(8deg) scaleX(.82)}}
.floor{position:fixed;z-index:49;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(90deg,var(--ink) 0 38px,#5a3b22 38px 42px);border-top:3px solid var(--ink)}
.stage{position:fixed;z-index:50;pointer-events:none;left:0;right:0;bottom:14px;height:170px}
.char{pointer-events:auto;position:absolute;bottom:0;width:76px;height:90px;cursor:pointer;transition:left 1s ease-in-out;transform:scale(.55);transform-origin:50% 100%}
.body{position:absolute;bottom:10px;left:0;width:76px;height:78px;background:var(--body);border:3px solid var(--ink);box-sizing:border-box;border-radius:30px 30px 12px 12px;box-shadow:inset 5px 0 0 rgba(255,255,255,.18),inset 0 -7px 0 rgba(0,0,0,.25);transition:transform .25s}
.eyes{position:absolute;top:24px;left:0;right:0;display:flex;justify-content:center;gap:14px;transition:transform .3s}
.eye{width:10px;height:17px;background:var(--eye);border-radius:6px;box-shadow:0 0 8px var(--eye);transition:transform .12s}
.blink .eye{transform:scaleY(.08)}
.sleep .eye{width:15px;height:7px;background:none;box-shadow:none;border-top:3px solid var(--eye);border-radius:15px 15px 0 0;box-sizing:border-box}
.sleep .body{transform:scaleY(.94) translateY(3px)}
.look-l .eyes{transform:translateX(-7px)}.look-r .eyes{transform:translateX(7px)}
.plume{position:absolute;top:-17px;left:50%;width:16px;height:28px;margin-left:-8px;background:var(--red);border-radius:50% 50% 10% 90%;transform:rotate(14deg);border:2px solid var(--ink);box-sizing:border-box}
.hat{position:absolute;top:-44px;left:50%;margin-left:-32px;border-left:32px solid transparent;border-right:32px solid transparent;border-bottom:50px solid var(--hat);filter:drop-shadow(0 0 0 var(--ink))}
.hat::after{content:"✦";position:absolute;left:-6px;top:22px;color:#ffd76a;font-size:13px}
.leg{position:absolute;bottom:0;width:14px;height:12px;background:var(--ink);border-radius:0 0 6px 6px}
.leg.l{left:18px}.leg.r{right:18px}
.walk .body{animation:bob .3s infinite}
.walk .leg.l{animation:step .3s infinite}.walk .leg.r{animation:step .3s infinite reverse}
@keyframes bob{50%{transform:translateY(-4px) rotate(2deg)}}
@keyframes step{50%{transform:translateY(-4px)}}
.jump .body{animation:jump .4s}
@keyframes jump{40%{transform:translateY(-18px)}}
.scared .eye{transform:scale(1.3)}
.scared.walk .body,.scared.walk .leg{animation-duration:.16s}
.acc{position:absolute;right:-32px;top:30px;font-size:44px;transform:rotate(12deg);filter:drop-shadow(1px 2px 0 rgba(0,0,0,.3))}
.bubble{position:absolute;bottom:150px;left:50%;transform-origin:50% 100%;transform:translateX(-50%) scale(1);opacity:0;pointer-events:none;background:#f6ecc9;color:#2b1a0e;border:3px solid #2b1a0e;border-radius:14px 14px 14px 4px;padding:8px 18px;white-space:nowrap;transition:.25s}
.bubble.show{opacity:1;transform:translateX(-50%) scale(1.8)}
.hand{position:absolute;left:-14px;top:-10px;font-size:42px;opacity:0;transform-origin:70% 80%}
.hi .hand{opacity:1;animation:wave .5s infinite alternate}
@keyframes wave{from{transform:rotate(-15deg)}to{transform:rotate(25deg)}}
.z{position:absolute;right:-6px;top:-10px;opacity:0;font-size:32px}
.sleep .z{animation:zz 2s infinite}
.sleep .z:nth-of-type(2){animation-delay:1s}
@keyframes zz{0%{opacity:0;transform:translate(0,10px)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-26px)}}
@media (pointer:fine){body,body .char,body .guest{cursor:none}}
.dragon{position:fixed;left:0;top:0;z-index:99;pointer-events:none;font-size:42px;line-height:1;display:none;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.3))}
.dragon i{display:block;font-style:normal;transition:transform .15s}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fk .35s ease-in-out infinite alternate}
@keyframes fk{from{transform:scale(1,1) rotate(-5deg)}to{transform:scale(.82,1.18) rotate(5deg)}}
.glow{animation:gl 1.1s ease-in-out infinite alternate}
@keyframes gl{from{opacity:.5}to{opacity:.95}}
.sword{position:absolute;left:-28px;top:4px;width:10px;height:58px;opacity:0;transform-origin:50% 100%;transform:rotate(-20deg);transition:opacity .2s}
.sword::before{content:"";position:absolute;top:0;left:0;width:10px;height:42px;box-sizing:border-box;background:linear-gradient(90deg,#f2f4f7,#98a1ab);border:2px solid #2b1a0e;border-radius:5px 5px 0 0}
.sword::after{content:"";position:absolute;top:40px;left:-5px;width:20px;height:6px;box-sizing:border-box;background:#e8b04a;border:2px solid #2b1a0e;border-radius:2px}
.sword i{position:absolute;top:45px;left:2px;width:6px;height:13px;box-sizing:border-box;background:#5a3b22;border:2px solid #2b1a0e}
.fight .sword{opacity:1;animation:slash .4s ease-in-out infinite alternate}
@keyframes slash{from{transform:rotate(-40deg)}to{transform:rotate(25deg)}}
.fight .body{transform:scale(1.07)}
.fight .eye{transform:scaleY(.6)}
.dragon.recoil svg{animation:rc .3s}
@keyframes rc{30%{transform:rotate(-14deg) translateY(-6px)}65%{transform:rotate(9deg)}}
.dragon svg{display:block;width:140px;height:auto;overflow:visible}
.wing{transform-box:fill-box;transform-origin:0% 100%;animation:flap .45s ease-in-out infinite alternate}
@keyframes flap{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}
.fire{position:fixed;z-index:98;pointer-events:none;font-size:28px;animation:fire .8s forwards}
@keyframes fire{to{transform:translate(var(--dx),-70px) scale(.3);opacity:0}}
/* ===== penyihir: tongkat + lingkaran sihir ===== */
.staff{position:absolute;left:-26px;top:-14px;width:8px;height:96px;opacity:0;transform-origin:50% 100%;transform:rotate(-12deg);transition:opacity .2s}
.staff::before{content:"";position:absolute;left:1px;top:10px;width:6px;height:86px;background:linear-gradient(90deg,#8a5a2b,#4a2c14);border:2px solid #2b1a0e;box-sizing:border-box;border-radius:3px}
.staff i{position:absolute;left:-6px;top:-4px;width:20px;height:20px;border-radius:50%;border:2px solid #2b1a0e;box-sizing:border-box;background:radial-gradient(circle at 35% 35%,#fff,var(--sc,#7fe3ff) 50%,#2a7cff);box-shadow:0 0 12px var(--sc,#5cc8ff),0 0 26px var(--sc,#2a7cff)}
.cast .staff{opacity:1;animation:thrust .45s ease-in-out infinite alternate}
.cast.look-r .staff{left:auto;right:-26px;animation-name:thrustR}
@keyframes thrust{from{transform:rotate(-14deg)}to{transform:rotate(10deg) translateY(-4px)}}
@keyframes thrustR{from{transform:rotate(14deg)}to{transform:rotate(-10deg) translateY(-4px)}}
.cast .acc{opacity:0}
.cast .body{transform:scale(1.07)}
.cast .eye{background:#aef0ff;box-shadow:0 0 10px #4ac8ff;transform:scaleY(.7)}
.mc{position:fixed;z-index:49;width:150px;height:150px;pointer-events:none;color:#4fc3ff;transition:left .35s,top .35s,color .25s;animation:mcIn .55s cubic-bezier(.2,1.4,.4,1) both}
.mc.out{animation:mcOut .35s forwards}
.mc svg{display:block;width:100%;height:100%;overflow:visible;stroke:currentColor;stroke:color-mix(in srgb,currentColor 45%,#fff);filter:drop-shadow(0 0 2px currentColor) drop-shadow(0 0 8px currentColor) drop-shadow(0 0 20px currentColor)}
.mc svg g{transform-origin:100px 100px}
.rA{animation:spin 14s linear infinite}.rB{animation:spin 9s linear infinite reverse}.rC{animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes mcIn{from{transform:scale(0) rotate(-120deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes mcOut{to{transform:scale(.2) rotate(120deg);opacity:0}}
.orb{position:fixed;left:0;top:0;z-index:98;pointer-events:none;width:34px;height:34px;display:grid;place-items:center;font-size:32px;line-height:1;color:var(--c);text-shadow:0 0 10px var(--c),0 0 22px var(--c)}
.sp,.pt{position:fixed;z-index:97;pointer-events:none;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.sp{animation:spf .45s forwards}
@keyframes spf{to{transform:scale(.1);opacity:0}}
.ring{position:fixed;z-index:98;pointer-events:none;border:3px solid var(--c);border-radius:50%;box-shadow:0 0 14px var(--c),inset 0 0 10px var(--c);animation:rg .45s forwards}
@keyframes rg{from{transform:scale(.2);opacity:1}to{transform:scale(1.3);opacity:0}}
.bolt{position:fixed;left:0;top:0;z-index:98;pointer-events:none;overflow:visible;animation:bf .32s forwards}
@keyframes bf{from{opacity:1}to{opacity:0}}
.dragon.hit i{filter:brightness(2) saturate(.3)}
/* ===== ksatria: pedang cahaya abadi ===== */
.excal .sword{opacity:1;transform:rotate(0deg);animation:none;filter:drop-shadow(0 0 5px #ffd84a) drop-shadow(0 0 12px #ffb300)}
.excal .sword::before{background:linear-gradient(90deg,#fffbe0,#ffd23a)}
.excal .sword::after{background:#ffe27a}
.excal .body{transform:scale(1.07)}
.excal .eye{background:#fff6b0;box-shadow:0 0 12px #ffd84a;transform:scaleY(.7)}
.exc-dim{position:fixed;z-index:47;left:0;right:0;top:0;bottom:14px;pointer-events:none;opacity:0;transition:opacity .6s;background:radial-gradient(ellipse at 50% 100%,rgba(30,15,80,.5),rgba(6,3,28,.74))}
.exc-clip{position:fixed;z-index:60;left:0;top:0;right:0;bottom:14px;overflow:hidden;pointer-events:none}
.exc{position:absolute;width:0;height:0;transform-origin:0 0}
.blade{position:absolute;left:0;bottom:0;width:22px;height:24px;transform:translateX(-50%);border-radius:11px 11px 0 0;background:linear-gradient(90deg,#ffb300,#ffe27a 28%,#fff 50%,#ffe27a 72%,#ffb300);filter:drop-shadow(0 0 6px #fff3b0) drop-shadow(0 0 16px #ffc61a) drop-shadow(0 0 34px #ff9d00)}
.blade::before{content:"";position:absolute;top:0;bottom:0;left:-46px;right:-46px;background:linear-gradient(90deg,transparent,rgba(255,205,60,.38) 50%,transparent)}
.blade::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(0deg,rgba(255,255,255,0) 0 28px,rgba(255,255,255,.85) 28px 36px,rgba(255,255,255,0) 36px 64px);animation:flow .45s linear infinite}
@keyframes flow{to{background-position:0 -64px}}
.flare{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;opacity:0;background:radial-gradient(circle,#fff 0,rgba(255,235,140,.9) 18%,rgba(255,190,40,.4) 45%,transparent 70%);animation:fp .5s ease-in-out infinite alternate}
.flare::before{content:"";position:absolute;left:-120px;right:-120px;top:58px;height:4px;background:linear-gradient(90deg,transparent,#fff 50%,transparent);filter:drop-shadow(0 0 6px #ffd84a)}
.flare::after{content:"";position:absolute;top:-30px;bottom:-30px;left:58px;width:4px;background:linear-gradient(0deg,transparent,#fff 50%,transparent);filter:drop-shadow(0 0 6px #ffd84a)}
@keyframes fp{from{transform:scale(.85)}to{transform:scale(1.15)}}
.exc-flash{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;pointer-events:none;background:radial-gradient(circle at var(--x) var(--y),rgba(255,248,200,.85),rgba(255,210,80,.35) 40%,transparent 70%);animation:ff .45s forwards}
@keyframes ff{to{opacity:0}}
.guest{position:absolute;right:max(20px,3%);bottom:56px;display:flex;gap:10px;align-items:center;background:#f6ecc9;color:#2b1a0e;border:3px solid #2b1a0e;box-shadow:5px 5px 0 #2b1a0e;border-radius:10px;padding:11px 20px;font:inherit;font-size:16px;cursor:pointer}
.guest span{background:#2b1a0e;color:#f6ecc9;border-radius:6px;padding:1px 8px;font-size:14px}
</style>
</head>

<script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const rand=(a,b)=>a+Math.random()*(b-a);
class Mascot{
  constructor(el,hello,brave){this.el=el;this.hello=hello;this.brave=brave;this.bubble=el.querySelector('.bubble');this.sleeping=false;
    el.addEventListener('click',()=>this.poke());this.loop()}
  async say(text,ms=2200,wave=true){
    this.bubble.textContent=text;this.bubble.classList.add('show');
    if(wave)this.el.classList.add('hi');
    await wait(ms);this.bubble.classList.remove('show');this.el.classList.remove('hi')}
  async blink(){this.el.classList.add('blink');await wait(140);this.el.classList.remove('blink')}
  async look(){const d=Math.random()<.5?'look-l':'look-r';this.el.classList.add(d);await wait(rand(900,1800));this.el.classList.remove(d)}
  async walk(){
    const W=this.el.parentElement.clientWidth-90;
    const from=this.el.offsetLeft,to=rand(10,Math.max(20,W)),dur=Math.max(.6,Math.abs(to-from)/110);
    this.el.style.transitionDuration=dur+'s';
    this.el.classList.add(to<from?'look-l':'look-r','walk');
    this.el.style.left=to+'px';await wait(dur*1000);
    this.el.classList.remove('walk','look-l','look-r')}
  async sleep(){this.sleeping=true;await this.blink();this.el.classList.add('sleep');
    await wait(rand(5000,9000));if(this.sleeping)await this.wake()}
  async wake(){if(!this.sleeping)return;this.sleeping=false;this.el.classList.remove('sleep');
    this.el.classList.add('jump');await wait(400);this.el.classList.remove('jump')}
  async poke(){
    if(this.sleeping){await this.wake();await this.say('Hah? Hamba tertidur…',1800,false)}
    else{this.el.classList.add('jump');await this.say(this.hello,1800);this.el.classList.remove('jump')}}
  async fight(mx){
    const el=this.el;
    this.fighting=true;this.hits=[];
    if(this.sleeping){this.sleeping=false;el.classList.remove('sleep')}
    el.style.transitionDuration='0s';el.style.left=el.offsetLeft+'px';el.classList.remove('walk','scared');
    const cx=()=>{const r=el.getBoundingClientRect();return r.left+r.width/2};
    const side=()=>dragonPos()[0]>=cx()?1:-1;
    let sd=side();
    el.classList.add('excal',sd>0?'look-r':'look-l');
    this.say('Cahaya abadi, bangkitlah!',2200,false);
    const dim=document.createElement('div');dim.className='exc-dim';document.body.appendChild(dim);
    requestAnimationFrame(()=>requestAnimationFrame(()=>dim.style.opacity='1'));
    const sw=el.querySelector('.sword'),r=sw.getBoundingClientRect();
    const bx=r.left+r.width/2,by=r.top+r.height*38/58;
    // 1) pedang berubah emas, cahaya berkumpul
    for(let i=0;i<16;i++){
      const an=rand(0,6.28),d=rand(60,110);
      const p=dot('pt',bx+Math.cos(an)*d,by-20+Math.sin(an)*d,'#ffd84a',rand(4,8));
      p.animate([{transform:'translate(0,0)',opacity:0},{opacity:1,offset:.3},{transform:`translate(${-Math.cos(an)*d}px,${-Math.sin(an)*d+20}px) scale(.3)`,opacity:0}],{duration:rand(500,800),delay:i*45,fill:'both'});
      setTimeout(()=>p.remove(),1700);
    }
    await wait(900);
    // 2) pedang memanjang ke atas
    const L=Math.hypot(innerWidth,innerHeight)*1.15;
    const clip=document.createElement('div');clip.className='exc-clip';
    clip.innerHTML='<div class="exc"><i class="flare"></i><div class="blade"></div></div>';
    document.body.appendChild(clip);
    const ex=clip.firstChild,bl=ex.lastChild,fl=ex.firstChild;
    ex.style.left=bx+'px';ex.style.top=by+'px';
    bl.animate([{height:'24px',width:'12px'},{height:L+'px',width:'22px'}],{duration:700,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
    fl.animate([{opacity:0},{opacity:1}],{duration:400,fill:'forwards'});
    for(let i=0;i<10;i++)setTimeout(()=>{
      const p=dot('pt',bx+rand(-26,26),by-rand(30,Math.min(L,innerHeight*.8)),'#ffe27a',rand(3,7));
      p.animate([{transform:'translateY(0)',opacity:1},{transform:`translateY(${-rand(30,90)}px) scale(.2)`,opacity:0}],{duration:rand(500,900)});
      setTimeout(()=>p.remove(),950)},i*70);
    await wait(1250);
    // 3) ayunan satu kali
    sd=side();
    const floorY=innerHeight-14,h=Math.max(40,floorY-by);
    let d=Math.min(Math.max(Math.abs(dragonPos()[0]-bx)+90,320),720);
    d=Math.max(160,Math.min(d,sd>0?innerWidth-70-bx:bx-70));
    const end=Math.PI/2+Math.atan2(h,d); // sedikit melewati horizontal supaya menancap ke lantai
    el.classList.remove('look-l','look-r');el.classList.add(sd>0?'look-r':'look-l');
    const setA=a=>ex.style.transform=`rotate(${a}rad)`;
    const tween=(f,t,ms,ease,cb)=>new Promise(res=>{const t0=performance.now();
      (function fr(n){const k=Math.max(0,Math.min(1,(n-t0)/ms)),a=f+(t-f)*ease(k);setA(a);cb&&cb(a);k<1?requestAnimationFrame(fr):res()})(t0)});
    let hit=false;
    const along=a=>{const [px,py]=dragonPos(),vx=px-bx,vy=py-by,dx=Math.sin(a),dy=-Math.cos(a);
      return {t:vx*dx+vy*dy,perp:Math.abs(vx*dy-vy*dx),px,py}};
    const check=a=>{if(hit)return;const o=along(a);
      if(o.t>0&&o.t<L&&o.perp<75){hit=true;impact(o.px,o.py,'#ffd84a');burst(o.px,o.py,'#fff2a0')}};
    await tween(0,-sd*.2,260,k=>1-Math.pow(1-k,3));
    await tween(-sd*.2,sd*end,340,k=>Math.pow(k,2.3),check);
    // 4) pedang menancap ke tanah: layar bergetar
    if(!hit){const o=along(sd*end);if(o.t>0&&o.perp<170)impact(o.px,o.py,'#ffd84a')}
    slam(bx+sd*d,floorY);
    await wait(700);
    clip.style.transition='opacity .5s';clip.style.opacity='0';dim.style.opacity='0';
    await wait(520);clip.remove();dim.remove();
    el.classList.remove('excal','look-l','look-r');
    this.say('Hmph! Jangan kembali!',1500,false);
    await wait(500);this.fighting=false}
  async cast(mx){
    this.fighting=true;this.hits=[];
    if(this.sleeping){this.sleeping=false;this.el.classList.remove('sleep')}
    const wx=()=>{const r=this.el.getBoundingClientRect();return r.left+r.width/2};
    const dir=()=>dragonPos()[0]>=wx()?1:-1;
    this.el.classList.add('cast',dir()>0?'look-r':'look-l');
    this.say('Rasakan sihirku, naga!',1700,false);
    const mc=document.createElement('div');mc.className='mc';mc.innerHTML=circleHTML();
    const place=()=>{
      const cx=Math.min(innerWidth-85,Math.max(85,wx()+dir()*100)),cy=innerHeight-14-95;
      mc.style.left=(cx-75)+'px';mc.style.top=(cy-75)+'px';return [cx,cy]};
    let [cx,cy]=place();
    document.body.appendChild(mc);
    await wait(650);
    for(const t of ['fire','ice','bolt','arcane','fire','bolt']){
      [cx,cy]=place();
      mc.style.color=SPELLS[t].c;this.el.style.setProperty('--sc',SPELLS[t].c);
      await wait(180);
      mc.firstChild.animate([{transform:'scale(1)'},{transform:'scale(1.14)'},{transform:'scale(1)'}],{duration:280});
      shoot(t,cx,cy);
      await wait(520);
    }
    mc.style.color='#4fc3ff';mc.classList.add('out');
    this.el.style.removeProperty('--sc');
    await wait(350);mc.remove();
    this.el.classList.remove('cast','look-l','look-r');
    this.say('Pergilah, makhluk bersisik!',1600,false);
    await wait(500);this.fighting=false}
  async flee(mx){
    if(this.fleeing||this.fighting)return;
    const now=performance.now();
    this.hits=(this.hits||[]).filter(t=>now-t<5000);this.hits.push(now);
    if(this.brave&&this.hits.length>=4)return this.fight(mx);
    if(this.mage&&this.hits.length>=3)return this.cast(mx);
    this.fleeing=true;
    if(this.sleeping){this.sleeping=false;this.el.classList.remove('sleep')}
    const W=this.el.parentElement.clientWidth-90;
    const from=this.el.offsetLeft,dir=(from+38<mx)?-1:1;
    let to=from+dir*rand(170,270);
    if(to<10||to>W)to=dir<0?W-rand(0,40):10+rand(0,40);
    to=Math.min(W,Math.max(10,to));
    const dur=Math.max(.35,Math.abs(to-from)/330);
    this.el.style.transitionDuration=dur+'s';
    this.el.classList.add('scared','walk',to<from?'look-l':'look-r');
    if(Math.random()<.5)this.say('Ampun, naga!',900,false);
    this.el.style.left=to+'px';await wait(dur*1000);
    this.el.classList.remove('scared','walk','look-l','look-r');
    await wait(250);this.fleeing=false}
  async loop(){
    while(true){
      await wait(rand(1200,3500));
      if(this.sleeping||this.fleeing||this.fighting)continue;
      const r=Math.random();
      if(r<.45)await this.blink();
      else if(r<.65)await this.look();
      else if(r<.88)await this.walk();
      else await this.sleep();
    }}
}
// ===== lingkaran sihir & mantra =====
function circleHTML(){
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const P=(r,a)=>[100+r*Math.sin(a),100-r*Math.cos(a)];
  const poly=(n,k,r)=>Array.from({length:n},(_,i)=>P(r,i*k*2*Math.PI/n).map(v=>v.toFixed(1)).join(',')).join(' ');
  const glyph=(r,a,h,w)=>{ // aksara sihir acak
    const n=3+Math.floor(rnd()*3);let d='';
    for(let i=0;i<n;i++){d+=(i?'L':'M')+((rnd()-.5)*h*.7).toFixed(1)+' '+((i/(n-1)-.5)*h+(rnd()-.5)*h*.25).toFixed(1)}
    const [x,y]=P(r,a);
    return `<path d="${d}" stroke-width="${w}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(a*180/Math.PI).toFixed(1)})"/>`};
  let A='<circle cx="100" cy="100" r="96" stroke-width="2.6"/><circle cx="100" cy="100" r="90" stroke-width="1"/><circle cx="100" cy="100" r="66" stroke-width="1"/><circle cx="100" cy="100" r="62" stroke-width="1.8"/>';
  for(let i=0;i<36;i++){
    const a=i*Math.PI/18;
    if(i%6===0){const [x,y]=P(78,a);
      A+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="6.5" stroke-width="1.4"/><path fill="currentColor" stroke-width=".6" d="M0-5L1.3-1.3 5 0 1.3 1.3 0 5-1.3 1.3-5 0-1.3-1.3Z"/></g>`}
    else A+=glyph(78,a,11,1.3);
  }
  let B=`<polygon points="${poly(7,2,69)}" stroke-width="2.2"/><circle cx="100" cy="100" r="50" stroke-width="1"/>`;
  for(let i=0;i<7;i++)B+=glyph(56,(i+.5)*2*Math.PI/7,8,1);
  const C=`<polygon points="${poly(5,2,34)}" stroke-width="2.4"/><circle cx="100" cy="100" r="22" stroke-width="1"/><circle cx="100" cy="100" r="17" stroke-width="1"/><path stroke-width="1.2" d="M100 88V112M88 100H112M91.5 91.5L108.5 108.5M108.5 91.5L91.5 108.5"/>`;
  return `<svg viewBox="0 0 200 200" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="100" cy="100" r="96" fill="#050d2e" fill-opacity=".78" stroke="none"/><circle cx="100" cy="100" r="96" fill="currentColor" fill-opacity=".16" stroke="none"/><g class="rA">${A}</g><g class="rB">${B}</g><g class="rC">${C}</g></svg>`;
}
const SPELLS={fire:{c:'#ff7a1a',g:'🔥'},ice:{c:'#7fe3ff',g:'❄️'},bolt:{c:'#ffe45a'},arcane:{c:'#c58bff',g:'✦'}};
function dragonPos(){const r=document.getElementById('dragon').getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]}
function dot(cls,x,y,c,s){
  const e=document.createElement('i');e.className=cls;e.style.cssText=`--c:${c};left:${x-s/2}px;top:${y-s/2}px;width:${s}px;height:${s}px`;
  document.body.appendChild(e);return e}
function burst(x,y,c){
  const r=document.createElement('div');r.className='ring';
  r.style.cssText=`--c:${c};left:${x-35}px;top:${y-35}px;width:70px;height:70px`;
  document.body.appendChild(r);setTimeout(()=>r.remove(),500);
  for(let i=0;i<10;i++){
    const p=dot('pt',x,y,c,rand(5,10)),an=rand(0,6.28),d=rand(30,75);
    p.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(an)*d}px,${Math.sin(an)*d}px) scale(.2)`,opacity:0}],{duration:rand(350,550),easing:'ease-out'});
    setTimeout(()=>p.remove(),600);
  }
}
function impact(x,y,c){
  burst(x,y,c);recoil(x,y);
  const dr=document.getElementById('dragon');dr.classList.add('hit');setTimeout(()=>dr.classList.remove('hit'),140)}
function lightning(sx,sy,tx,ty){
  const NS='http://www.w3.org/2000/svg',s=document.createElementNS(NS,'svg');
  s.setAttribute('class','bolt');s.setAttribute('width',innerWidth);s.setAttribute('height',innerHeight);
  const dx=tx-sx,dy=ty-sy,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,pts=[];
  for(let i=0;i<=9;i++){const t=i/9,j=(i===0||i===9)?0:rand(-18,18);pts.push((sx+dx*t+nx*j).toFixed(1)+','+(sy+dy*t+ny*j).toFixed(1))}
  s.innerHTML=`<polyline points="${pts.join(' ')}" fill="none" stroke="#ffd000" stroke-opacity=".6" stroke-width="9" stroke-linejoin="round" style="filter:blur(3px)"/><polyline points="${pts.join(' ')}" fill="none" stroke="#fffbe0" stroke-width="3" stroke-linejoin="round" style="filter:drop-shadow(0 0 5px #ffe45a)"/>`;
  document.body.appendChild(s);setTimeout(()=>s.remove(),340);
  setTimeout(()=>impact(tx,ty,SPELLS.bolt.c),50);
}
function shoot(type,sx,sy){
  const S=SPELLS[type];
  if(type==='bolt'){const [tx,ty]=dragonPos();return lightning(sx,sy,tx,ty)}
  const o=document.createElement('div');o.className='orb';o.style.setProperty('--c',S.c);o.textContent=S.g;
  document.body.appendChild(o);
  let px=sx,py=sy,v=0,last=performance.now(),n=0;const t0=last;
  (function step(now){ // mantra mengejar naga
    const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;
    const [tx,ty]=dragonPos(),dx=tx-px,dy=ty-py,d=Math.hypot(dx,dy);
    v=Math.min(1100,v+3200*dt);const m=v*dt;
    if(d<=m+30||now-t0>2000){o.remove();return impact(tx,ty,S.c)}
    px+=dx/d*m;py+=dy/d*m;
    o.style.transform=`translate(${px-17}px,${py-17}px) rotate(${now/3}deg)`;
    if(n++%2===0){const sp=dot('sp',px,py,S.c,rand(6,12));setTimeout(()=>sp.remove(),460)}
    requestAnimationFrame(step);
  })(last);
}
function slam(x,y){
  document.body.animate([{transform:'translate(0,0)'},{transform:'translate(-14px,10px)'},{transform:'translate(12px,-9px)'},{transform:'translate(-9px,7px)'},{transform:'translate(7px,-5px)'},{transform:'translate(-4px,3px)'},{transform:'translate(0,0)'}],{duration:650,easing:'ease-out'});
  const f=document.createElement('div');f.className='exc-flash';f.style.setProperty('--x',x+'px');f.style.setProperty('--y',y+'px');
  document.body.appendChild(f);setTimeout(()=>f.remove(),500);
  const g=document.createElement('div');g.className='ring';
  g.style.cssText=`--c:#ffd84a;left:${x-120}px;top:${y-28}px;width:240px;height:56px`;
  document.body.appendChild(g);setTimeout(()=>g.remove(),500);
  for(let i=0;i<16;i++){
    const gold=i%2,p=dot('pt',x+rand(-70,70),y-4,gold?'#ffd84a':'#d9c28a',gold?rand(4,8):rand(9,17));
    p.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${rand(-110,110)}px,${-rand(25,gold?150:70)}px) scale(${gold?.3:2})`,opacity:0}],{duration:rand(500,850),easing:'ease-out'});
    setTimeout(()=>p.remove(),900);
  }
}
const a=new Mascot(document.getElementById('a'),'Salam, Tuan!',true);
const b=new Mascot(document.getElementById('b'),'Salam, Puan!');
b.mage=true;a.holy=true;
addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;
  for(const m of [a,b]){
    const r=m.el.getBoundingClientRect();
    const d=Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2));
    if(m.fighting){
      const L=e.clientX<r.left+r.width/2;
      m.el.classList.toggle('look-l',L);m.el.classList.toggle('look-r',!L);
      if(d<150&&!m.mage&&!m.holy)recoil(e.clientX,e.clientY);
    }else if(d<130)m.flee(e.clientX);
  }
});
// kursor naga (hanya untuk perangkat dengan mouse)
if(matchMedia('(pointer:fine)').matches){
  const dr=document.getElementById('dragon'),di=dr.firstChild;
  let tx=0,ty=0,x=0,y=0,shown=false,face=1;
  addEventListener('pointermove',e=>{
    if(e.pointerType!=='mouse')return;
    if(!shown){shown=true;x=tx=e.clientX;y=ty=e.clientY;dr.style.display='block'}
    if(Math.abs(e.clientX-tx)>2)face=e.clientX>tx?-1:1;
    tx=e.clientX;ty=e.clientY;di.style.transform='scaleX('+face+')';
  });
  addEventListener('pointerdown',e=>{
    if(e.pointerType!=='mouse')return;
    for(let i=0;i<5;i++){
      const f=document.createElement('span');f.className='fire';f.textContent='🔥';
      f.style.left=(e.clientX-14+(-face)*(18+i*10))+'px';f.style.top=(e.clientY-14+rand(-10,10))+'px';
      f.style.setProperty('--dx',(-face*rand(20,70))+'px');f.style.animationDelay=(i*50)+'ms';
      document.body.appendChild(f);setTimeout(()=>f.remove(),1000+i*50);
    }
  });
  (function tick(){x+=(tx-x)*.25;y+=(ty-y)*.25;
    dr.style.transform='translate('+(x-(face===1?12:128))+'px,'+(y-24)+'px)';requestAnimationFrame(tick)})();
}
let recoilT=0;
function recoil(x,y){
  const n=performance.now();if(n-recoilT<500)return;recoilT=n;
  const dr=document.getElementById('dragon');dr.classList.add('recoil');setTimeout(()=>dr.classList.remove('recoil'),300);
  const s=document.createElement('span');s.className='fire';s.textContent='✦';
  s.style.cssText='left:'+(x-14)+'px;top:'+(y-14)+'px;color:#ffd84a;--dx:'+rand(-30,30)+'px';
  document.body.appendChild(s);setTimeout(()=>s.remove(),900);
}
// sapaan pertama saat halaman dibuka
setTimeout(()=>a.say('Salam, Tuan!',2800),600);
setTimeout(()=>b.say('Selamat datang!',2200),1800);
</script>
